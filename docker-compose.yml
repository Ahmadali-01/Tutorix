services:
  postgres:
    image: postgres:16
    network_mode: host
    environment:
      POSTGRES_USER: tutorix
      POSTGRES_PASSWORD: tutorix
      POSTGRES_DB: tutorix
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutorix -d tutorix"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7
    network_mode: host

  qdrant:
    image: qdrant/qdrant:latest
    network_mode: host
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: ./backend
    network_mode: host
    env_file: ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
  qdrant_data: